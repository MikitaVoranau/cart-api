apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cart-api.fullname" . }}-config
  labels:
    {{- include "cart-api.labels" . | nindent 4 }}
data:
  HTTP_PORT: {{ .Values.config.httpPort | quote }}
  POSTGRES_HOST: {{ default (printf "%s-postgres" (include "cart-api.fullname" .)) .Values.config.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  POSTGRES_USER: {{ .Values.config.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.config.postgres.db | quote }}
