nameOverride: ""
fullnameOverride: ""

namespace:
  create: false

image:
  repository: cart-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  httpPort: "3000"
  postgres:
    host: ""
    port: "5432"
    user: "postgres"
    db: "carts"

secret:
  postgresPassword: "12345"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

ingress:
  enabled: false
  className: nginx
  host: cart-api.local
  path: /

replicaCount: 1

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 6

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

postgres:
  enabled: true
  replicas: 1
  image: postgres:16-alpine
  db: carts
  user: postgres
  passwordFromSecretKey: POSTGRES_PASS
  servicePort: 5432
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard
    useStaticPV: false
    staticPV:
      storageClassName: manual
      hostPathBase: /mnt/data

